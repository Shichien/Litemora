<!DOCTYPE html>
<html lang="zh-CN" class="dark-theme">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Litemora | Playable Schematic Worlds</title>
    <meta name="title" content="Litemora | Playable Schematic Worlds" />
    <meta name="application-name" content="Litemora" />
    <meta
      name="description"
      content="Litemora turns Minecraft schematics into playable online worlds with native resource-pack rendering, true collision, first-person exploration, and shareable gallery spaces."
    />
    <meta
      name="keywords"
      content="Litemora, Minecraft, litematic, schematic, schem, three.js, Cubane, resource pack, playable worlds, voxel gallery"
    />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" sizes="192x192" href="/favicon/favicon-192.webp" />
    <link rel="icon" sizes="512x512" href="/favicon/favicon-512.webp" />
    <meta name="rating" content="General" />
    <meta name="robots" content="index,follow" />
    <meta property="og:url" content="https://litemora.art/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Litemora | Playable Schematic Worlds" />
    <meta
      property="og:description"
      content="Import Minecraft schematics, render true block appearance from resource packs, and walk through them in first person."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="litemora.art" />
    <meta property="twitter:url" content="https://litemora.art/" />
    <meta name="twitter:title" content="Litemora | Playable Schematic Worlds" />
    <meta
      name="twitter:description"
      content="A cinematic web front end for Minecraft schematic worlds, gallery spaces, and first-person exploration."
    />
    <meta name="twitter:image" content="/og.jpg" />
    <link rel="apple-touch-icon" href="/favicon/favicon-512.webp" />
    <link rel="mask-icon" href="/favicon/favicon-512.webp" color="black" />
    <meta name="apple-mobile-web-app-title" content="Litemora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#08121b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/loading-screen.css" />

    <script>
      if (location.hostname.endsWith('vercel.app')) {
        const insightsScript = document.createElement('script')
        insightsScript.defer = true
        insightsScript.src = '/_vercel/insights/script.js'
        document.head.append(insightsScript)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Loading 全屏 进度 -->
    <div id="loading-screen">
      <div class="loading-panel">
        <div class="loading-text">
          <h2 class="loading-title">Loading Litemora</h2>
          <p id="loading-percentage" class="loading-percentage">0%</p>
        </div>
        <div class="loading-track">
          <div id="loading-bar"></div>
        </div>
      </div>
    </div>
    <noscript class="text-center text-lg text-red-500">
      请启用 JavaScript 以加载 Litemora 的交互内容。
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
