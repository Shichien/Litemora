    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://litemora.art/#organization",
            "name": "Litemora",
            "url": "https://litemora.art/",
            "logo": "https://litemora.art/logo.webp"
          },
          {
            "@type": "WebSite",
            "@id": "https://litemora.art/#website",
            "url": "https://litemora.art/",
            "name": "Litemora",
            "description": "A browser-based gallery for turning Minecraft .litematic, .schem, .schematic, and Axiom .bp files into explorable 3D worlds.",
            "publisher": { "@id": "https://litemora.art/#organization" },
            "inLanguage": ["en", "zh-CN"]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://litemora.art/#application",
            "name": "Litemora",
            "url": "https://litemora.art/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any",
            "description": "Import supported Minecraft build files, render block states with resource-pack visuals, and explore builds in first person in the browser.",

          }
        ]

    <link rel="stylesheet" href="/loading-screen.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Loading 全屏 进度 -->
    <div id="loading-screen" class="ls-root" role="status" aria-label="Loading Litemora">
      <div class="ls-stage">
        <h2 class="ls-brand">LITEMORA</h2>
        <div class="ls-circuit" aria-hidden="true">
          <span class="ls-torch"></span>
          <div class="ls-track">
            <div id="loading-bar" class="ls-fill"><div class="ls-dust"></div></div>
            <span class="ls-lamp"></span>
          </div>
        </div>
        <div class="ls-status">
          <span class="ls-label"><span class="ls-tag">LOADING</span></span>
          <p id="loading-percentage" class="ls-pct">0%</p>
        </div>
      </div>
    </div>
    <noscript class="text-center text-lg text-red-500">
      <section>
        <h1>Litemora — Playable Schematic Worlds</h1>
        <p>Litemora is a browser-based gallery for Minecraft builds. Import a build and explore it in first person.</p>
        <h2>What Litemora provides</h2>
        <ul>
          <li>Convert supported Minecraft build files into shareable web spaces.</li>
          <li>Render Minecraft block states with resource-pack based visuals.</li>
          <li>Explore public spaces and worlds in a first-person browser view.</li>
        </ul>
        <p>JavaScript is required for the interactive 3D viewer. Public spaces are available through their shared URLs; private spaces are not listed in the public index.</p>
      </section>
      <p>请启用 JavaScript 以加载 Litemora 的交互式 3D 内容。</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
